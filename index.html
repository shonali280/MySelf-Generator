<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySelf Profile Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="form-section">

            <div class="heading">
                <p class="tag">MY PROFILE</p>
                <h1>MySelf Profile Generator</h1>
                <p>Create a simple personal profile in seconds.</p>
            </div>

            <form id="profileForm">

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select your gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="sport">Favourite Sport</label>
                    <input
                        type="text"
                        id="sport"
                        placeholder="Example: Badminton"
                        required>
                </div>

                <div class="input-group">
                    <label for="ambition">Ambition</label>
                    <input
                        type="text"
                        id="ambition"
                        placeholder="Example: Software Engineer"
                        required
                    >
                </div>

                <button type="submit" class="generate-btn">
                    Generate My Profile
                </button>

            </form>

        </section>


        <section class="preview-section">

            <div class="profile-card" id="profileCard">

                <div class="avatar">
                    <span id="avatarLetter">M</span>
                </div>

                <p class="small-title">PERSONAL PROFILE</p>

                <h2 id="displayName">Your Name</h2>

                <p class="profile-intro">
                    Complete the form to generate your personal profile.
                </p>

                <div class="profile-details">

                    <div class="detail">
                        <span>Age</span>
                        <strong id="displayAge">—</strong>
                    </div>

                    <div class="detail">
                        <span>Gender</span>
                        <strong id="displayGender">—</strong>
                    </div>

                    <div class="detail">
                        <span>City</span>
                        <strong id="displayCity">—</strong>
                    </div>

                    <div class="detail">
                        <span>Favourite Sport</span>
                        <strong id="displaySport">—</strong>
                    </div>

                </div>

                <div class="ambition-box">
                    <span>My Ambition</span>
                    <h3 id="displayAmbition">
                        Your ambition will appear here
                    </h3>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Built with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
